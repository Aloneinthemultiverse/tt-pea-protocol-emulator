# Tiny Tapeout project information
project:
  title:        "PEA protocol emulator"
  author:       "Sujit Narrayan M"
  discord:      ""
  description:  "Four programmable protocol engines: UART, SPI, I2C and NRZI/bit-stuffed protocols in firmware"
  language:     "Verilog"
  clock_hz:     50000000
  tiles: "8x4"
  top_module:  "tt_um_auralis_pea"
  source_files:
    - "tt_um_auralis_pea.v"
    - "pea_core.v"
    - "pea_engine.v"

pinout:
  ui[0]: "SPI SCLK"
  ui[1]: "SPI CSn"
  ui[2]: "SPI MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "SPI MISO"
  uo[1]: "IRQ"
  uo[2]: "flag 0"
  uo[3]: "flag 1"
  uo[4]: "flag 2"
  uo[5]: "flag 3"
  uo[6]: "flag 4"
  uo[7]: "flag 5"
  uio[0]: "protocol pin 0"
  uio[1]: "protocol pin 1"
  uio[2]: "protocol pin 2"
  uio[3]: "protocol pin 3"
  uio[4]: "protocol pin 4"
  uio[5]: "protocol pin 5"
  uio[6]: "protocol pin 6"
  uio[7]: "protocol pin 7"

yaml_version: 6
