name: protocol_tb
on: [push, workflow_dispatch]
jobs:
  protocol_tb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: yosys -q -p 'read_verilog src/pea_engine.v src/pea_core.v src/tt_um_auralis_pea.v; synth -top tt_um_auralis_pea -flatten; check -assert; stat' | tail -25
      - run: verilator --lint-only -Wall -Wno-DECLFILENAME -Wno-MULTITOP src/pea_engine.v src/pea_core.v src/tt_um_auralis_pea.v --top-module tt_um_auralis_pea
      - run: python3 test/gen_tb.py
      - run: iverilog -g2012 -o sim test/tb_pea.sv src/*.v && vvp -n sim | tee sim.log
      - run: "! grep -q FAIL sim.log"
      - run: /usr/bin/python3 -m pip install --break-system-packages -q matplotlib && /usr/bin/python3 test/plot_waves.py waves.txt docs/waveforms
      - uses: actions/upload-artifact@v4
        with:
          name: waveforms
          path: docs/waveforms
      - run: iverilog -g2012 -o esim test/tb_engine_rand.sv src/pea_engine.v && vvp -n esim
      - run: python3 test/pea_ref.py engine_trace.txt
      - run: bash test/mutants.sh
